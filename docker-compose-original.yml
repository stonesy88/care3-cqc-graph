services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"   # HTTP interface
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
      - neo4j_data:/data
    networks:
      - cqc_network

  neo4j-init:
    image: neo4j:5
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USERNAME=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
    networks:
      - cqc_network
    command: >
      bash -c "cypher-shell -a $$NEO4J_URI -u $$NEO4J_USERNAME -p $$NEO4J_PASSWORD -f /scripts/init_db.py"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cocoindex
    ports:
      - "5432:5432"
    networks:
      - cqc_network

  pipeline:
    build: .
    volumes:
      - .:/app
    environment:
      - CQC_API_KEY=${CQC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_URI=bolt://neo4j:7687
      - COCOINDEX_DATABASE_URL=postgres://postgres:password@postgres:5432/cocoindex
      - HF_TOKEN=${HF_TOKEN}
    depends_on:
      # Wait for Neo4j to be fully ready before starting the CocoIndex pipeline
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - cqc_network
    command: python main.py

  web:
    image: node:20-alpine
    working_dir: /app/web
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - EMBEDDER_URL=http://embedder:8001/embed
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - .:/app
      - /app/web/node_modules
    networks:
      - cqc_network
    depends_on:
      - neo4j
      - embedder

  embedder:
    build: 
      context: ./embedder
      args:
        HF_TOKEN: ${HF_TOKEN}
    ports:
      - "8001:8001"
    environment:
      - MODEL_NAME=google/embeddinggemma-300m
      - HF_TOKEN=${HF_TOKEN}
    networks:
      - cqc_network

networks:
  cqc_network:
    driver: bridge

volumes:
  neo4j_data: