services:
  neo4j:
    image: neo4j:5-community
    profiles: ["core", "data"]
    ports:
      - "7474:7474"   # HTTP interface
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
      - neo4j_data:/data
    networks:
      - cqc_network

  neo4j-init:
    # FIX: Changed to a Python image so it can actually run init_db.py
    image: python:3.11-slim 
    profiles: ["core", "data"]
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USERNAME=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
    networks:
      - cqc_network
    # FIX: Install the driver and run the python script directly
    command: >
      bash -c "pip install neo4j && python /scripts/init_db.py"

  postgres:
    image: postgres:15-alpine
    profiles: ["core", "data"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cocoindex
    ports:
      - "5432:5432"
    networks:
      - cqc_network

  pipeline:
    build: .
    profiles: ["pipeline"]
    volumes:
      - .:/app
    environment:
      - CQC_API_KEY=${CQC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_URI=bolt://neo4j:7687
      - COCOINDEX_DATABASE_URL=postgres://postgres:password@postgres:5432/cocoindex
      - HF_TOKEN=${HF_TOKEN}
    ports:
      - "49344:49344"  # Expose CocoInsight Server 
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - cqc_network
    command: bash -c "pip install -U cocoindex && python cocoindex/pipeline.py"
    deploy:
      resources:
        limits:
          memory: 8G

  restate:
    image: docker.io/restatedev/restate:latest
    profiles: ["restate"]
    environment:
      - RESTATE_BETA_FEATURES=true
      - RESTATE_POSTGRES_ADDRESS=0.0.0.0:9001
      - RESTATE_SQL_BIND_ADDRESS=0.0.0.0:9001
      - RESTATE_SQL_ENABLED=true
    ports:
      - "8080:8080" # Ingress
      - "9070:9070" # Admin API
      - "9071:9071" # Metrics
      - "9001:9001" # SQL Introspection
    networks:
      - cqc_network

  web:
    image: node:20
    profiles: ["core", "web"]
    working_dir: /app/web
    command: sh -c "npm install && npx next dev -H 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - EMBEDDER_URL=http://embedder:8001/embed
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - COCOINDEX_DATABASE_URL=postgres://postgres:password@postgres:5432/cocoindex
      - HOSTNAME=0.0.0.0
    volumes:
      - .:/app
      - /app/web/node_modules
    networks:
      - cqc_network
    depends_on:
      - neo4j
      - embedder

  neo4j-grag:
    build: 
      context: ./neo4j-grag
      dockerfile: Dockerfile
    profiles: ["core", "ai"]
    volumes:
      - ./neo4j-grag:/app
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HYBRID_TOP_K=15
      - CANDIDATE_K=60
    networks:
      - cqc_network
    depends_on:
      neo4j:
        condition: service_healthy

  embedder:
    build: 
      context: ./embedder
      args:
        HF_TOKEN: ${HF_TOKEN}
    profiles: ["core", "ai"]
    ports:
      - "8001:8001"
    environment:
      - MODEL_NAME=google/embeddinggemma-300m
      - HF_TOKEN=${HF_TOKEN}
    networks:
      - cqc_network
    deploy:
      resources:
        limits:
          memory: 4G

  shadowtraffic:
    image: shadowtraffic/shadowtraffic:latest
    profiles: ["gen-events"]
    env_file:
      - ./shadowtraffic/license.env
    ports:
      - "9876:8080"
    volumes:
      - ./shadowtraffic:/workspace
    command: --config /workspace/shadowtraffic.json --with-studio --watch --sample 50
    networks:
      - cqc_network
    depends_on:
      - web

networks:
  cqc_network:
    driver: bridge

volumes:
  neo4j_data: